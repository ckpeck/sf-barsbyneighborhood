<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>San Francisco Bars by Neighborhood</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- Papa parse to look up google sheets -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body class="sidebar-hidden"> <!-- Sidebar starts hidden -->

  <header id="pageHeader">
    <h1>San Francisco Bar Tour</h1>
  </header>

  <!-- Toggle Button -->
  <button id="sidebarToggle" title="Toggle Menu Sidebar">☰ Menu</button>

  <div id="main">
    <div id="map"></div>

   <div id="sidebar">

<h3>Search</h3>
<input id="nameSearch">

<h3>Style</h3>
<select id="styleFilter">
    <option value="">All Styles</option>
</select>

<hr>

<h3>People</h3>

<table id="peopleMatrix">
<thead>
<tr>
<th></th>
<th>A</th>
<th>B</th>
<th>C</th>
<th>Br</th>
<th>K</th>
</tr>
</thead>

<tbody>

<tr>
<td>Visited</td>

<td id="AllisonYes"></td>
<td id="BenYes"></td>
<td id="ChristinaYes"></td>
<td id="BrianYes"></td>
<td id="KyleYes"></td>

</tr>

<tr>

<td>Not</td>

<td id="AllisonNo"></td>
<td id="BenNo"></td>
<td id="ChristinaNo"></td>
<td id="BrianNo"></td>
<td id="KyleNo"></td>

</tr>

</tbody>

</table>

<hr>

<h3>Group Visits</h3>

<table id="groupTable">

<tbody>

<tr><td>Nobody</td><td id="group0"></td></tr>
<tr><td>1 Person</td><td id="group1"></td></tr>
<tr><td>2 People</td><td id="group2"></td></tr>
<tr><td>3 People</td><td id="group3"></td></tr>
<tr><td>4 People</td><td id="group4"></td></tr>
<tr><td>Everyone</td><td id="group5"></td></tr>

</tbody>

</table>

<hr>

<div id="barCount"></div>

<button onclick="clearFilters()">Clear Filters</button>

</div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="js/map.js"></script>

  <!-- Optional: Shrinking header on scroll -->
  <script>
    window.addEventListener('scroll', function () {
      const header = document.getElementById('pageHeader');
      if (window.scrollY > 20) {
        header.style.padding = "10px 0";
        header.style.fontSize = "1.5em";
      } else {
        header.style.padding = "20px 0";
        header.style.fontSize = "1.8em";
      }
    });
  </script>
</body>
</html>
